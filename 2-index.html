</style></head><body><header><span class="brand"><span class="dot"></span>Small joys</span><button id="browse" aria-label="Open arranged external ideas">30 ideas ↗</button></header><main><div class="eyebrow">A little playground</div><h1>Make a little magic</h1><p class="lead">Touch the sky. Leave a mark.</p><div class="stage" style="padding:12px"><svg id="sky" class="sky" viewBox="0 0 600 600" role="img" aria-label="Your artwork, empty"><rect width="600" height="600" fill="#161f2b"/><circle cx="483" cy="88" r="33" fill="#f4ebdb"/><g id="marks"></g></svg></div><div class="controls draw-bar swatches"><button data-ink="#73a89a" aria-label="Rain colour" aria-pressed="true" style="background:#73a89a"></button><button data-ink="#c99b73" aria-label="Coffee colour" aria-pressed="false" style="background:#c99b73"></button><button data-ink="#c2cbec" aria-label="Moon colour" aria-pressed="false" style="background:#c2cbec"></button><button data-ink="#e7bd6c" aria-label="Sun colour" aria-pressed="false" style="background:#e7bd6c"></button></div><div class="controls"><button id="mirror" aria-pressed="true">Mirror</button><button id="shape">Stars</button><button id="add">Add a mark</button><button id="undo" disabled>Undo</button><button id="reset">Clear</button></div><p id="feedback" class="status ticker" role="status" aria-live="polite">0 / 120 marks</p><div class="controls"><button id="scene">Moonlight</button><button id="remix">Remix</button><button id="scatter">Scatter</button></div>
<footer>No accounts, uploads or tracking. Local play resets on reload.</footer></main><section id="drawer" class="drawer" aria-label="Arranged ideas"><div class="drawer-inner"><div class="drawer-head"><h2>30 ideas</h2><button id="closeDrawer">Close</button></div><p class="caption">Visual reference picker. These open real external sources, not already made local gifts.</p><button id="fav">Favourites</button><div id="tiles" class="picker"></div><div class="controls"><button id="prev">←</button><span id="page"></span><button id="next">→</button></div></div></section><dialog id="ideaDialog"><div class="controls" style="justify-content:space-between"><span id="sourceName" class="caption"></span><button id="closeDialog" aria-label="Close idea">×</button></div><div id="ideaIcon" style="height:70px"></div><h2 id="ideaName"></h2><p id="ideaDetail"></p><p id="ideaCaveat" class="caption"></p><div class="controls"><a id="source" target="_blank" rel="noopener noreferrer">Open source ↗</a><button id="star">Favourite</button></div></dialog><script>const $=id=>document.getElementById(id);const paths={star:'M32 5L39 23L59 25L44 38L48 58L32 47L16 58L20 38L5 25L25 23Z',coffee:'M10 25H44V40Q43 53 28 53Q12 53 10 40ZM44 29H51Q62 38 44 43M9 57H49M19 8Q13 15 19 20M32 8Q26 15 32 20',rain:'M9 30Q10 14 24 18Q27 5 41 13Q51 15 52 25Q66 27 55 37H11Q4 34 9 30ZM20 44L15 55M34 44L29 55M48 44L43 55',knight:'M12 55H51V49H16L24 33L13 28L22 13L36 9L42 19L44 33L50 46H21M25 14L23 6L35 10M16 27L28 25',gift:'M8 24H56V56H8ZM5 15H59V25H5ZM32 15V56M32 15Q4 2 19 4Q29 3 32 15Q39 0 50 6Q59 17 32 15',play:'M20 8L55 32L20 56Z',heart:'M32 56L8 31Q-1 10 17 8Q27 7 32 18Q40 3 52 9Q68 20 56 34Z',grid:'M5 5H59V59H5ZM23 5V59M41 5V59M5 23H59M5 41H59',note:'M17 46V10L49 5V40M17 13L49 8M17 43Q-1 40 5 51Q15 61 17 46M49 37Q29 35 36 48Q48 56 49 40',balloon:'M32 5Q4 4 8 31Q13 55 32 49Q56 55 57 29Q58 4 32 5ZM28 49L32 44L36 49M32 50Q21 60 35 62',palette:'M32 5Q1 5 4 33Q7 59 28 58Q34 58 34 50Q33 40 43 41Q63 44 60 27Q57 5 32 5ZM15 $('browse').onclick=()=>{$('drawer').classList.add('open');picker();$('closeDrawer').focus()};$('closeDrawer').onclick=()=>{$('drawer').classList.remove('open');$('browse').focus()};$('closeDialog').onclick=()=>$('ideaDialog').close();$('star').onclick=()=>{stars.has(selected.number)?stars.delete(selected.number):stars.add(selected.number);$('star').textContent=stars.has(selected.number)?'Remove favourite':'Favourite';picker()};$('fav').onclick=()=>{only=!only;page=0;picker()};$('prev').onclick=()=>{page--;picker();$('tiles').scrollIntoView()};$('next').onclick=()=>{page++;picker();$('tiles').scrollIntoView()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ideaDialog').open){$('drawer').classList.remove('open');$('browse').focus()}});

let marks=[],ink='#73a89a',mirror=true,shape=0,scene=0;const shapes=['Stars','Circles','Diamonds'];function paint(){let bg=['#161f2b','#27222c','#22332f'][scene];$('sky').querySelector('rect').setAttribute('fill',bg);$('marks').innerHTML=marks.flatMap((m,i)=>(mirror?[m.x,600-m.x]:[m.x]).map((x,j)=>shape===0?`<path d="M${x} ${m.y-14}l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z" fill="${m.c}"/>`:shape===1?`<circle cx="${x}" cy="${m.y}" r="10" fill="${m.c}"/>`:`<path d="M${x} ${m.y-14}l12 14-12 14-12-14Z" fill="${m.c}"/>`)).join('');$('sky').setAttribute('aria-label',`Your artwork, ${marks.length} marks`);$('feedback').textContent=`${marks.length} / 120 marks`;$('undo').disabled=!marks.length;$('mirror').setAttribute('aria-pressed',mirror);$('shape').textContent=shapes[shape];$('scene').textContent=['Moonlight','Twilight','Forest'][scene]}
function add(x,y){marks.push({x:Math.max(15,Math.min(585,x)),y:Math.max(15,Math.min(585,y)),c:ink});if(marks.length>120)marks.shift();paint()}let drawing=false,lastPoint=0;$('sky').onpointerdown=e=>{drawing=true;$('sky').setPointerCapture(e.pointerId);draw(e)};$('sky').onpointermove=e=>{if(drawing&&e.timeStamp-lastPoint>45)draw(e)};$('sky').onpointerup=()=>drawing=false;$('sky').onpointercancel=()=>drawing=false;function draw(e){lastPoint=e.timeStamp;const r=$('sky').getBoundingClientRect();add((e.clientX-r.left)/r.width*600,(e.clientY-r.top)/r.height*600)}
$('mirror').onclick=()=>{mirror=!mirror;paint()};$('shape').onclick=()=>{shape=(shape+1)%3;paint()};$('scene').onclick=()=>{scene=(scene+1)%3;paint()};$('add').onclick=()=>{let n=marks.length;add(45+(n*73)%510,45+(n*97)%510)};$('undo').onclick=()=>{marks.pop();paint()};$('reset').onclick=()=>{marks=[];paint()};$('remix').onclick=()=>{marks=marks.map((m,i)=>({...m,x:600-m.y,y:m.x,c:['#73a89a','#c99b73','#c2cbec','#e7bd6c'][i%4]}));paint()};$('scatter').onclick=()=>{for(let i=0;i<12;i++)add(40+Math.random()*520,40+Math.random()*520)};document.querySelectorAll('[data-ink]').forEach(b=>b.onclick=()=>{ink=b.dataset.ink;document.querySelectorAll('[data-ink]').forEach(v=>v.setAttribute('aria-pressed',v===b))});paint();
</script></body></html>
